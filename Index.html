        /* Navigation */

            top: 0;

            backdrop-filter: blur(10px);
            border-bottom: 1px solid #eee;
        }

        /* Left side: Name + icons */
        .left-nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }
